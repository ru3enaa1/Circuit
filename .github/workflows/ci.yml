# The whole local build, on a clean Linux machine: guards, dependency audit, types, and the
# tests with coverage against a real PostgreSQL started from the same compose.yaml.
# Each command here is the one CLAUDE.md §9 documents for local use.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# Read-only token: this workflow builds and tests, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash adds -o pipefail, so a failing command before a pipe fails the step.
    shell: bash

jobs:
  check:
    name: Guardas, tipos y pruebas
    # Pinned, not ubuntu-latest: the image changes under a moving label (CLAUDE.md, Reproducible).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned to a full commit SHA: a tag can be moved to other code, a SHA cannot.
      # Versions and SHAs checked against the tags on 2026-11-24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left in .git/config.
          persist-credentials: false

      # The guards need only git and bash: they run first and fail fast.
      - name: Guarda de secretos, controles positivos
        run: bash guards/check-secrets.test.sh
      - name: Guarda de secretos
        run: bash guards/check-secrets.sh
      # The hook itself runs only on the author's machine (R9); CI proves it still stops
      # what it must and lets the rest through.
      - name: Hook de pre-push, controles positivos
        run: bash guards/pre-push.test.sh
      - name: Finales de línea de los archivos comparados byte a byte
        run: bash guards/check-line-endings.sh '*.sh' '*.json' '*.sql' 'guards/hooks/*' 'database/examples/**' '**/golden/**'
      - name: Frases prohibidas
        # The README is the first text a reader sees, so it is checked like the apps (F0.6).
        run: bash guards/check-forbidden-phrases.sh forbidden-phrases.txt README.md docs/caso.md apps database scenarios docker compose.yaml Dockerfile

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The exact version verified locally (CLAUDE.md §5).
          node-version: 24.20.0
          cache: npm
      - name: Dependencias exactas del lockfile
        run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=low

      # Non-secret values come from .env.example, as on a fresh clone. The passwords are made
      # for this run only and reach Compose, drizzle-kit and the tests through the
      # environment, which takes precedence over .env (database/env.ts). The tests create
      # crm_app and circuit_app with CRM_DB_PASSWORD and CIRCUIT_DB_PASSWORD, the way
      # `npm run db:users` does (ADR-0006 D4, ADR-0010 D11).
      - name: Entorno local con contraseñas de un solo uso
        run: |
          cp .env.example .env
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"
          crm_password="$(openssl rand -hex 24)"
          echo "::add-mask::${crm_password}"
          echo "CRM_DB_PASSWORD=${crm_password}" >> "$GITHUB_ENV"
          circuit_password="$(openssl rand -hex 24)"
          echo "::add-mask::${circuit_password}"
          echo "CIRCUIT_DB_PASSWORD=${circuit_password}" >> "$GITHUB_ENV"
      - name: PostgreSQL desde compose.yaml
        id: db
        run: docker compose up -d --wait db
      # ADR-0005 D14 (audit H1 a): this server has never had the service roles, so here, and
      # only here, two databases really race to create them; db:migrate below makes them.
      # CIRCUIT_FRESH_ROLES makes the test fail if the roles already exist, instead of
      # passing without a race.
      - name: Carrera de roles en un servidor nuevo
        env:
          CIRCUIT_FRESH_ROLES: '1'
        run: npx vitest run --project database migrations-db -t "two disposable databases"
      - name: Migraciones sobre la base de desarrollo
        run: npm run db:migrate
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas con cobertura
        run: npm run test:coverage
      - name: Registro de PostgreSQL si algo falló
        # Only when Compose got to run: an earlier failure (a guard, npm ci) leaves no .env and
        # no container, and this step would add a second, misleading red step (run 45449147850).
        if: failure() && steps.db.outcome != 'skipped'
        run: docker compose logs db

  # ADR-0020 D8: what a person who clones the repository does, on a clean machine: no .env, no
  # Node, no key. One command brings everything up, and one request goes from intake to close.
  compose:
    name: docker compose up en una máquina limpia
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Todo arriba con un comando, sin .env ni llave
        id: up
        run: |
          test ! -e .env
          docker compose up -d --wait --build
      - name: Una solicitud de la entrada al cierre, aprobada como en el tablero
        run: docker compose exec -T circuit node docker/smoke.ts
      - name: El tablero responde en 127.0.0.1
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:4020/
      - name: Registro de los servicios si algo falló
        # The services print no password and no key (ADR-0020 D4, D5; ADR-0009 D17).
        if: failure() && steps.up.outcome != 'skipped'
        run: docker compose logs
